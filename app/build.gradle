plugins {
    alias(libs.plugins.android.application)
    id 'org.jetbrains.kotlin.android' // Kotlin plugin
    id 'com.google.gms.google-services' //// Add the Google services Gradle plugin
}

android {
    namespace 'com.example.cs499_weighttracker_pn'
    compileSdk 35
    buildToolsVersion "35.0.0"

    defaultConfig {
        applicationId "com.example.cs499_weighttracker_pn"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    kotlinOptions {
        jvmTarget = "17"
    }
}

dependencies {
    implementation libs.appcompat
    implementation libs.material
    testImplementation libs.junit
    androidTestImplementation libs.ext.junit
    androidTestImplementation libs.espresso.core

    // 1) Use the BoM to align all Firebase lib versions
    implementation platform('com.google.firebase:firebase-bom:33.14.0')

    // 2) The KTX libraries you actually need
    implementation 'com.google.firebase:firebase-auth-ktx'
    implementation 'com.google.firebase:firebase-firestore-ktx'

    // 3) (Optional) If you want App Check—Play Integrity or Debug:
    implementation 'com.google.firebase:firebase-appcheck-playintegrity'
    implementation 'com.google.firebase:firebase-appcheck-debug'

    // 4) **Crucial**: the interop layer FirestoreRegistrar needs
    implementation 'com.google.firebase:firebase-appcheck-interop:17.1.0'

    // Building the chart library
    implementation 'com.github.PhilJay:MPAndroidChart:v3.1.0'
    implementation libs.kotlin.stdlib

    // For use of version catalog
    implementation libs.constraintlayout
    implementation libs.recyclerview
}